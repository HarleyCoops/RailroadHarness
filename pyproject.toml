[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railroad-harness"
version = "0.1.0"
description = "OpenCode harness training (TRL + OpenEnv) on 1959 railroad operating rules"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "HarleyCoops" }
]
keywords = [
    "reinforcement-learning",
    "trl",
    "openenv",
    "railroad",
    "historical",
    "grpo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "trl>=0.12.0",
    "datasets>=2.0.0",
    "transformers>=4.40.0",
    "trackio>=0.1.0",
    "huggingface_hub>=0.22.0",
]

[project.optional-dependencies]
local = [
    "openenv-opencode-env @ git+https://github.com/huggingface/OpenEnv.git#subdirectory=envs/opencode_env",
]
remote = [
    "openenv @ git+https://github.com/huggingface/OpenEnv.git",
    "openenv-opencode-env @ git+https://github.com/huggingface/OpenEnv.git#subdirectory=envs/opencode_env",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
all = [
    "railroad-harness[local,remote,dev]",
]

[project.urls]
Homepage = "https://github.com/HarleyCoops/RailroadHarness"
Repository = "https://github.com/HarleyCoops/RailroadHarness"
Documentation = "https://github.com/HarleyCoops/RailroadHarness#readme"
"Dataset" = "https://huggingface.co/datasets/HarleyCooper/volume2gym-railroad-1959"
"TRL Blog" = "https://huggingface.co/blog/sergiopaniego/trl-openenv-harness-training"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["railroad_verifier"]
